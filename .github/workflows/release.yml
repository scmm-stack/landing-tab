name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run verify
      # Sets the version output only when a new release was published.
      - id: release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-edge:
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/publish-edge.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets: inherit

  publish-firefox:
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/publish-firefox.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets: inherit
