name: Publish to Edge

# Runs after every release, called from release.yml. A release made with the
# default GitHub token can't start another workflow by an event, so it is called
# directly. It can still be started by hand, for a dry run or to retry a release
# that Edge refused. It uploads the exact package attached to the GitHub Release,
# so what ships is what was verified. Edge then certifies it, which can take days.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, such as v1.2.0
        required: true
        type: string
      dry_run:
        description: Only check the credentials
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v1.2.0
        required: true
        type: string
      dry_run:
        description: Only check the credentials
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: edge-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download the released package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --pattern '*-edge.zip' --dir release
      # The publisher's dry run skips Edge entirely, so this asks about a made-up
      # upload. It changes nothing, and only a refused login counts as a failure.
      - name: Check the Edge credentials
        if: inputs.dry_run
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          status=$(curl -s -m 30 -o /dev/null -w '%{http_code}' \
            -H "Authorization: ApiKey $EDGE_API_KEY" \
            -H "X-ClientID: $EDGE_CLIENT_ID" \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions/draft/package/operations/00000000-0000-0000-0000-000000000000")
          echo "Edge answered $status"
          case "$status" in
            000|401|403|410)
              echo "::error::Edge refused these credentials ($status)"
              exit 1
              ;;
          esac
      - name: Submit to Microsoft Edge Add-ons
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          args=(--edge-zip release/*-edge.zip)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          npx wxt submit "${args[@]}"
